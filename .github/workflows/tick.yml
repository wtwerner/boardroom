name: tick
# Calls the site through the day, for the reminder before a night and the morning-after DM
# asking for its plays. Vercel's Hobby crons only run once a day. Needs the repo secrets
# SITE_URL (https://your-site.example) and CRON_SECRET (the same as Vercel's); without them it
# does nothing. Every 15 minutes, off the hour (GitHub delays runs at :00 most), but GitHub
# often runs it hours apart, so it's a backup to a scheduler that runs on time (the README's
# "Reminders and the morning after"). That's free for a public repo or fork; a private repo
# pays for each run in Actions minutes, so run it hourly there ("7 * * * *").
on:
  schedule:
    - cron: "2-59/15 * * * *"
  workflow_dispatch:
permissions: {}
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SITE_URL: ${{ secrets.SITE_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Call /api/cron/tick
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "SITE_URL or CRON_SECRET isn't set, so there's nothing to call."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 120 \
            -H "Authorization: Bearer $CRON_SECRET" "${SITE_URL%/}/api/cron/tick"
